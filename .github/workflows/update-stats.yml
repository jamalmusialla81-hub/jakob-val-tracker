name: Update rolling stats

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: rolling-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch and export stats
        env:
          HENRIK_API_KEY: ${{ secrets.HENRIK_API_KEY }}
          VAL_REGION: ap
          VAL_NAME: King
          VAL_TAG: Jakob
        run: python tracker.py --once

      - name: Push changed stats
        run: |
          git add stats/history.json stats/latest.json
          if git diff --cached --quiet; then
            echo "No new stats to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update rolling stats"
          git push
